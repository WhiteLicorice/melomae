name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The model, the parity inputs, and the triage fixture are in Git LFS. Checkout does not fetch
      # them, so list them, restore `.git/lfs` from the cache, then pull. The
      # cache key changes only when the committed LFS objects change, so CI
      # spends LFS bandwidth on a cache miss only.
      - name: Write the Git LFS object list
        run: git lfs ls-files --long > .git/lfs-objects.txt

      - name: Cache the Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.git/lfs-objects.txt') }}

      - name: Fetch the Git LFS objects
        run: git lfs pull

      # The pinned ffmpeg for the decode tests. `pnpm verify` runs tools/fetch_ffmpeg.py, which
      # downloads it on a cache miss. Do not use apt or choco ffmpeg: the versions differ.
      - name: Cache the pinned ffmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-autobuild-2026-08-31-13-27

      # The pinned ONNX Runtime the engine loads at run time (task 33). `pnpm verify` runs
      # tools/fetch_onnxruntime.py, which downloads it on a cache miss.
      - name: Cache the pinned ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .cache/onnxruntime
          key: onnxruntime-${{ runner.os }}-v1.28.3

      # The pinned cargo-deny (task 26). `pnpm verify` runs tools/cargo_deny.py, which
      # downloads it on a cache miss.
      - name: Cache the pinned cargo-deny
        uses: actions/cache@v4
        with:
          path: .cache/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pnpm install --frozen-lockfile

      # The export group holds torch. Its tests skip without it.
      - run: pnpm verify
        env:
          UV_NO_GROUP: export
